=========================================================================
  פיד סרטונים — הכל בקובץ אחד.
  הסרטונים נמשכים מהרפו בגיטהאב. לייקים ותגובות: מקומי, או אמיתי עם Firebase.
=========================================================================

  להוסיף סרטון
  ------------
  מעלים קובץ .mp4 לרפו (לשורש או לתיקיית videos/) ומרעננים. זה הכל.
  עד 100MB לקובץ. מומלץ MP4 (H.264+AAC), 1080x1920, עד ~30 שניות.
  הסדר לפי שם הקובץ — לכן כדאי 01-, 02-, 03-...

  לשנות את השם של האפליקציה
  --------------------------
  למטה בבלוק CONFIG:  appName: "השם שלך"      (ריק = מוצג "בקרוב")


=========================================================================
  לייקים ותגובות אמיתיים — Firebase  (אופציונלי, 5 דקות)
=========================================================================
  בלי זה הכל עובד, פשוט כל אחד רואה רק את הלייקים והתגובות של עצמו.

  1) console.firebase.google.com  ▸  Create a project

  2) Build ▸ Firestore Database ▸ Create database
     אזור eur3 (אירופה) ▸ production mode

  3) Build ▸ Authentication ▸ Get started
     ▸ Sign-in method ▸ Google ▸ Enable
       (בוחרים שם ציבורי לפרויקט + אימייל תמיכה) ▸ Save
     ▸ Settings ▸ Authorized domains ▸ Add domain:
       0772292196ai-oss.github.io

  4) Firestore ▸ Rules ▸ מוחקים הכל ▸ מדביקים את מה שבין הקווים ▸ Publish

  ------------------------------- חוקי האבטחה -------------------------------
  rules_version = '2';

  service cloud.firestore {
    match /databases/{database}/documents {

      function googleUser() {
        return request.auth != null
               && request.auth.token.firebase.sign_in_provider == 'google.com';
      }

      match /videos/{vid} {
        allow read: if true;

        allow write: if googleUser()
                     && request.resource.data.keys().hasOnly(['likes', 'comments'])
                     && (!('likes' in request.resource.data)
                         || (request.resource.data.likes is int && request.resource.data.likes >= 0))
                     && (!('comments' in request.resource.data)
                         || (request.resource.data.comments is int && request.resource.data.comments >= 0));

        match /likes/{uid} {
          allow read:   if true;
          allow create: if googleUser() && request.auth.uid == uid;
          allow delete: if googleUser() && request.auth.uid == uid;
          allow update: if false;
        }

        match /comments/{cid} {
          allow read: if true;
          allow create: if googleUser()
                        && request.resource.data.uid == request.auth.uid
                        && request.resource.data.text is string
                        && request.resource.data.text.size() > 0
                        && request.resource.data.text.size() <= 300
                        && request.resource.data.name is string
                        && request.resource.data.name.size() > 0
                        && request.resource.data.name.size() <= 60;
          allow delete: if googleUser() && resource.data.uid == request.auth.uid;
          allow update: if false;
        }
      }

      match /{document=**} {
        allow read, write: if false;
      }
    }
  }
  ---------------------------------------------------------------------------

     החוקים האלה הם מה שבאמת אוכף שרק מחוברי Google יכולים ללייק ולהגיב,
     ובלעדיהם כל אחד באינטרנט יוכל למחוק לך את כל הנתונים.

  5) ⚙ Project settings ▸ Your apps ▸ </> ▸ Register app
     מעתיקים 4 ערכים מתוך firebaseConfig אל CONFIG.firebase למטה.
     המפתחות האלה אמורים להיות גלויים בקוד — ככה Firebase עובד.
     מה שמגן על הנתונים זה החוקים משלב 4.

  לא עובד? F12 ▸ Console ▸ מחפשים [cloud]
     operation-not-allowed ............ לא הפעלת Google (שלב 3)
     permission-denied ................ החוקים לא פורסמו (שלב 4)
     auth/unauthorized-domain ......... הדומיין לא ברשימה (שלב 3)
     NOT_FOUND / not been started ..... אין בסיס נתונים (שלב 2)
  במסך "אני" בתוך האפליקציה: נקודה ירוקה = הענן מחובר.

  מכסה חינם: 50,000 קריאות ו-20,000 כתיבות ביום. לייק או תגובה = כתיבה אחת.
=========================================================================
-->

<style>

<!-- ============================================================
     שכבת הענן: Firestore — לייקים ותגובות אמיתיים
     נטען רק אם מילאת את CONFIG.firebase. אחרת הכל נשאר מקומי.
     ============================================================ -->
<script type="module">
const api  = window.CLOUD;
const done = window.__cloudDone;

(async () => {
  const cfg = (window.CONFIG.firebase) || {};
  if (!cfg.apiKey || !cfg.projectId) { done(api); return; }   // לא מוגדר — מצב מקומי

  try {
    const V = "11.0.2";
    const base = "https://www.gstatic.com/firebasejs/" + V + "/";
    const [core, auth, fs] = await Promise.all([
      import(base + "firebase-app.js"),
      import(base + "firebase-auth.js"),
      import(base + "firebase-firestore.js")
    ]);

    const app = core.initializeApp(cfg);
    const db  = fs.getFirestore(app);
    const a   = auth.getAuth(app);
    const provider = new auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });

    /* ---- התחברות עם Google ----
       הצפייה בפיד פתוחה לכולם. לייק ותגובה דורשים חשבון Google,
       וגם חוקי האבטחה ב-Firestore אוכפים את זה בצד השרת. */
    api.user = null;
    let onUserCb = null;
    api.onUser = cb => { onUserCb = cb; cb(api.user); };

    // חזרה מהפניה (בטלפון, כשחלון קופץ נחסם)
    try { await auth.getRedirectResult(a); }
    catch (e) { console.warn("[cloud] redirect:", e && e.code); }

    await new Promise(res => {
      let first = true;
      auth.onAuthStateChanged(a, u => {
        api.user = u ? {
          uid:   u.uid,
          name:  u.displayName || (u.email || "").split("@")[0] || "משתמש",
          email: u.email || "",
          photo: u.photoURL || ""
        } : null;
        api.uid = u ? u.uid : null;
        if (first) { first = false; res(); }
        else if (onUserCb) onUserCb(api.user);
      });
    });

    api.signIn = async () => {
      try {
        await auth.signInWithPopup(a, provider);
      } catch (e) {
        const c = (e && e.code) || "";
        if (/popup-blocked|operation-not-supported|web-storage-unsupported/.test(c)) {
          await auth.signInWithRedirect(a, provider);   // נפילה להפניה מלאה
          return;
        }
        throw e;
      }
    };
    api.signOut = () => auth.signOut(a);

    /* ---- התחברות ל-GitHub, רק בשביל העלאת סרטונים ----
       רצה על מופע Firebase נפרד כדי לא לדרוס את הסשן של Google,
       והטוקן נשאר בזיכרון בלבד — לא נשמר בדפדפן. */
    api.ghToken = null;
    api.ghLogin = null;
    api.ghSignIn = async () => {
      if (!api._a2) {
        const app2 = core.initializeApp(cfg, "uploader");
        api._a2 = auth.getAuth(app2);
        try { await auth.setPersistence(api._a2, auth.inMemoryPersistence); } catch {}
      }
      const p = new auth.GithubAuthProvider();
      p.addScope("public_repo");
      const res  = await auth.signInWithPopup(api._a2, p);
      const cred = auth.GithubAuthProvider.credentialFromResult(res);
      api.ghToken = (cred && cred.accessToken) || null;
      const info  = res.user && res.user.reloadUserInfo;
      api.ghLogin = (info && info.screenName) || (res.user && res.user.displayName) || "github";
      return api.ghToken;
    };

    const vdoc  = k => fs.doc(db, "videos", k);
    const likeD = k => fs.doc(db, "videos", k, "likes", api.uid);
    const cmts  = k => fs.collection(db, "videos", k, "comments");

    /** מאזין אחד לכל המונים של כל הסרטונים */
    api.watchStats = cb => fs.onSnapshot(
      fs.collection(db, "videos"),
      snap => { const m = {}; snap.forEach(d => (m[d.id] = d.data() || {})); cb(m); },
      err => console.warn("[cloud] stats:", err.message)
    );

    /** האם המשתמש הזה כבר עשה לייק לסרטון */
    api.hasLiked = async k => {
      try { return (await fs.getDoc(likeD(k))).exists(); } catch { return false; }
    };

    /** לייק / ביטול לייק — מסמך אישי + עדכון המונה, בכתיבה אחת */
    api.setLike = async (k, on) => {
      const b = fs.writeBatch(db);
      if (on) b.set(likeD(k), { at: fs.serverTimestamp() });
      else    b.delete(likeD(k));
      b.set(vdoc(k), { likes: fs.increment(on ? 1 : -1) }, { merge: true });
      await b.commit();
    };

    /* ---- מי העלה כל סרטון: שם, תמונה, כיתוב ---- */
    api.watchClips = cb => fs.onSnapshot(
      fs.collection(db, "clips"),
      snap => { const m = {}; snap.forEach(d => (m[d.id] = d.data() || {})); cb(m); },
      err => console.warn("[cloud] clips:", err.message)
    );

    api.setClip = (key, data) => {
      const doc = {
        uid:     api.uid,
        name:    (api.user && api.user.name)  || "",
        photo:   (api.user && api.user.photo) || "",
        caption: data.caption || "",
        at:      fs.serverTimestamp()
      };
      if (data.src) doc.src = data.src;                 // סרטון שמאוחסן ב-Cloudinary
      if ("approved" in data) doc.approved = !!data.approved;
      return fs.setDoc(fs.doc(db, "clips", key), doc);
    };

    /** קריאה חד-פעמית של כל רשומות הסרטונים, לבניית הפיד */
    api.listClips = async () => {
      const snap = await fs.getDocs(fs.collection(db, "clips"));
      return snap.docs.map(d => {
        const v = d.data() || {};
        return Object.assign({ id: d.id, atMs: v.at && v.at.toMillis ? v.at.toMillis() : 0 }, v);
      });
    };

    /** אישור של המנהל — הופך סרטון ממתין לגלוי בפיד */
    api.approveClip = key => fs.updateDoc(fs.doc(db, "clips", key), { approved: true });
    api.deleteClip  = key => fs.deleteDoc(fs.doc(db, "clips", key));

    /* ---- עוקבים ---- */
    api.watchFollows = cb => fs.onSnapshot(
      fs.collection(db, "follows"),
      snap => cb(snap.docs.map(d => d.data())),
      err => console.warn("[cloud] follows:", err.message)
    );

    api.setFollow = async (targetUid, on) => {
      const id = api.uid + "_" + targetUid;
      const ref = fs.doc(db, "follows", id);
      if (on) await fs.setDoc(ref, { follower: api.uid, following: targetUid, at: fs.serverTimestamp() });
      else    await fs.deleteDoc(ref);
    };

    /** תגובות בזמן אמת */
    api.watchComments = (k, cb) => fs.onSnapshot(
      fs.query(cmts(k), fs.orderBy("at", "desc"), fs.limit(200)),
      snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err => cb(null, err.message)
    );

    api.addComment = async (k, name, text) => {
      const b = fs.writeBatch(db);
      b.set(fs.doc(cmts(k)), {
        uid: api.uid, name, text,
        photo: (api.user && api.user.photo) || "",
        at: fs.serverTimestamp()
      });
      b.set(vdoc(k), { comments: fs.increment(1) }, { merge: true });
      await b.commit();
    };

    api.delComment = async (k, id) => {
      const b = fs.writeBatch(db);
      b.delete(fs.doc(db, "videos", k, "comments", id));
      b.set(vdoc(k), { comments: fs.increment(-1) }, { merge: true });
      await b.commit();
    };

    api.on = true;
  } catch (e) {
    api.error = (e && (e.code || e.message)) || String(e);
    console.warn("[cloud] לא הצלחתי להתחבר ל-Firebase:", api.error);
  }
  done(api);
})();
</script>

<script>
(() => {
"use strict";

const C = window.CONFIG;
const VIDEO_EXT = /\.(mp4|m4v|mov|webm|ogv|ogg)$/i;
const IMAGE_EXT = /\.(jpe?g|png|webp|gif|avif)$/i;
const LS = "nn:" + C.owner + "/" + C.repo;

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(LS + ":" + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(LS + ":" + k, JSON.stringify(v)); } catch {} }
};

const feed   = $("#feed");
const tpl    = $("#tpl");
const boot   = $("#boot");
let   cards  = [];        // [{el, video, item, srcs, srcIdx, ready}]
let   items  = [];        // רשימת הסרטונים
let   active = -1;
let   muted  = store.get("muted", true);
let   firstGestureDone = false;

/* ---- ענן ---- */
let   CL    = { on: false };   // ה-API מהסקריפט שלמעלה (או מצב מקומי)
const stats = {};              // { vidKey: {likes, comments} } — מתעדכן בזמן אמת
const liked = new Map();       // { vidKey: true/false } — הלייקים שלי
const clips = {};              // { clipKey: {uid, name, photo, caption} } — מי העלה מה
let   iFollow   = new Set();   // ה-uid-ים שאני עוקב אחריהם
let   followers = {};          // { uid: כמה עוקבים יש לו }
let   tab = "foryou";          // "foryou" או "following"

/** מזהה יציב לסרטון, חוקי כ-document id ב-Firestore */
function vidKey(path) {
  let h = 0;
  for (let i = 0; i < path.length; i++) h = (h * 31 + path.charCodeAt(i)) >>> 0;
  const slug = path.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
  return (slug || "v") + "-" + h.toString(36);
}

/** השם שמופיע על התגובות שלי */
function myName() {
  let n = store.get("name", "");
  if (!n) { n = "אורח" + Math.floor(1000 + Math.random() * 9000); store.set("name", n); }
  return n;
}
function askName() {
  const n = (prompt("איך לקרוא לך בתגובות?", myName()) || "").trim().slice(0, 24);
  if (n) { store.set("name", n); toast("מעכשיו אתה " + n); return true; }
  return false;
}

function cloudErr(e) {
  const c = (e && (e.code || e.message)) || "";
  if (/permission-denied/i.test(c)) return "אין הרשאה. בדוק את חוקי האבטחה ב-Firestore.";
  if (/unavailable|network/i.test(c)) return "אין חיבור לרשת.";
  return c || "שגיאה לא ידועה";
}

/* ============================================================
   1. מיתוג — שם או "בקרוב"
   ============================================================ */
(function brand() {

  if (name) {

/* ============================================================
   2. איתור הסרטונים ב"ענן" (גיטהאב)
   סדר עדיפויות:
     א. videos.json שבתוך הרפו  — אתה שולט בסדר, בכותרות ובתיאורים
     ב. סריקה אוטומטית של כל הרפו בקריאת API אחת
   ============================================================ */
const repoRoot = `https://raw.githubusercontent.com/${C.owner}/${C.repo}/${C.branch}/`;

/* אם הדף מוגש מ-GitHub Pages של אותו רפו (או מכל שרת שהסרטונים יושבים לידו),
   עדיף למשוך את הקבצים יחסית — אותו מקור, בלי קפיצה לשרת אחר. */
let selfHosted = /\.github\.io$/i.test(location.hostname);

function enc(p) { return p.split("/").map(encodeURIComponent).join("/"); }

/** כל כתובות ההגשה האפשריות לקובץ, לפי סדר ניסיון */
function srcsFor(path) {
  if (/^https?:/i.test(path)) return [path];
  const p = enc(path.replace(/^\/+/, ""));
  const out = [];
  if (selfHosted) out.push("./" + p);                                   // אותו מקור — הכי מהיר
  out.push(repoRoot + p);                                               // raw.githubusercontent
  out.push(`https://cdn.jsdelivr.net/gh/${C.owner}/${C.repo}@${C.branch}/${p}`); // CDN (עד 20MB לקובץ)
  return out;
}

/** מזהה יציב לסרטון לפי שם הקובץ בלבד — שורד את המעבר מ-pending ל-videos */
function clipKey(path) {
  const base = decodeURIComponent(path.split("/").pop()).replace(VIDEO_EXT, "");
  let h = 0;
  for (let i = 0; i < base.length; i++) h = (h * 31 + base.charCodeAt(i)) >>> 0;
  const slug = base.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 50);
  return (slug || "c") + "-" + h.toString(36);
}

function prettify(path) {
  return decodeURIComponent(path.split("/").pop())
    .replace(VIDEO_EXT, "")
    .replace(/^\d{8}-/, "")          // חותמת התאריך שההעלאה מהאתר מוסיפה
    .replace(/-[a-z0-9]{4}$/i, "")   // והסיומת האקראית
    .replace(/\[[^\]]*\]/g, " ")     // [BEN EAGLE], [9JsbHS1m9Wk] וכו'
    .replace(/[（(][^)）]*[)）]/g, " ")
    .replace(/[-_]+/g, " ")
    .replace(/\s+/g, " ")
    .trim();
}

async function fromJson() {
  const bust = "?t=" + Date.now();
  for (const url of ["./videos.json" + bust, repoRoot + "videos.json" + bust]) {
    try {
      const r = await fetch(url, { cache: "no-store" });
      if (!r.ok) continue;
      const raw = await r.json();
      // ה-json נמצא ליד index.html ⇒ גם הסרטונים כנראה כאן
      if (url.startsWith("./")) selfHosted = true;
      const list = Array.isArray(raw) ? raw : (raw.videos || []);
      const out = list.map(v => {
        const o = typeof v === "string" ? { src: v } : (v || {});
        if (!o.src) return null;
        return {
          path:    o.src,
          title:   o.title || o.caption || prettify(o.src),
          author:  o.author || C.defaultAuthor,
          sound:   o.sound || "הצליל המקורי",
          poster:  o.poster ? srcsFor(o.poster)[0] : "",
          cover:   o.cover !== false
        };
      }).filter(Boolean);
      if (out.length) return out;
    } catch {}
  }
  return [];
}

async function fromRepoTree() {
  const api = `https://api.github.com/repos/${C.owner}/${C.repo}/git/trees/${C.branch}?recursive=1`;
  const r = await fetch(api, { headers: { Accept: "application/vnd.github+json" } });
  if (!r.ok) {
    if (r.status === 403) throw new Error("rate");    // מגבלת 60 קריאות לשעה מאותו IP
    if (r.status === 404 || r.status === 409) return []; // רפו ריק
    throw new Error("http " + r.status);
  }
  const data = await r.json();
  const files = (data.tree || []).filter(n => n.type === "blob");
  const posters = new Map();
  for (const f of files) {
    if (IMAGE_EXT.test(f.path)) posters.set(f.path.replace(IMAGE_EXT, "").toLowerCase(), f.path);
  }
  const dir = (C.videosDir || "").replace(/^\/+|\/+$/g, "");
  const pend = (C.pendingDir || "").replace(/^\/+|\/+$/g, "").toLowerCase();
  let vids = files.filter(f => VIDEO_EXT.test(f.path));
  // סרטונים שממתינים לאישור המנהל לא נכנסים לפיד
  if (pend) vids = vids.filter(f => !f.path.toLowerCase().startsWith(pend + "/"));
  if (dir) {
    const inDir = vids.filter(f => f.path.toLowerCase().startsWith(dir.toLowerCase() + "/"));
    if (inDir.length) vids = inDir;                   // יש תיקיית videos — משתמשים רק בה
  }
  vids.sort((a, b) => a.path.localeCompare(b.path, "he", { numeric: true }));
  return vids.map(f => {
    const pk = f.path.replace(VIDEO_EXT, "").toLowerCase();
    return {
      path:   f.path,
      title:  prettify(f.path),
      author: C.defaultAuthor,
      sound:  "הצליל המקורי",
      poster: posters.has(pk) ? srcsFor(posters.get(pk))[0] : "",
      cover:  true,
      bytes:  f.size || 0
    };
  });
}

/** סרטונים שהועלו ל-Cloudinary ונרשמו ב-Firestore (רק מאושרים) */
async function fromCloud() {
  if (!CL.on || !CL.listClips) return [];
  let docs;
  try { docs = await CL.listClips(); } catch { return []; }
  return docs
    .filter(d => d.src && d.approved !== false)
    .sort((a, b) => (b.atMs || 0) - (a.atMs || 0))     // החדש למעלה
    .map(d => ({
      path:   d.src,                                   // כתובת מלאה — srcsFor מחזיר אותה כמו שהיא
      clipId: d.id,
      title:  d.caption || "",
      author: d.name || C.defaultAuthor,
      sound:  "הצליל המקורי",
      poster: "",
      cover:  true
    }));
}

async function discover() {
  const cloud = await fromCloud();

  const json = await fromJson();
  if (json.length) { store.set("cache", json); return cloud.concat(json); }
  try {
    const tree = await fromRepoTree();
    if (tree.length) store.set("cache", tree);
    return cloud.concat(tree);
  } catch (e) {
    const cached = store.get("cache", []);
    if (cached.length || cloud.length) return cloud.concat(cached);
    throw e;
  }
}

/* ============================================================
   3. בניית הכרטיסים
   ============================================================ */
function buildCard(item, i) {
  const el = tpl.content.firstElementChild.cloneNode(true);
  const video = $("video", el);
  const srcs = srcsFor(item.path);

  if (item.cover !== false) el.classList.add("cover");
  if (item.poster) video.poster = item.poster;
  video.muted = true;                                 // חובה בשביל autoplay; משתחרר אחרי מחווה ראשונה

  $(".marq", el).textContent = item.sound || "הצליל המקורי";

  const card = { el, video, item, srcs, srcIdx: 0, i, clip: item.clipId || clipKey(item.path) };
  paintOwner(card);

  /* --- נגן: מצבים --- */
  video.addEventListener("waiting",      () => el.classList.add("loading"));
  video.addEventListener("canplay",      () => el.classList.remove("loading"));
  video.addEventListener("loadeddata",   () => el.classList.remove("loading"));
  video.addEventListener("playing",      () => { el.classList.remove("loading", "paused"); el.classList.add("playing"); });
  video.addEventListener("pause",        () => { el.classList.remove("playing"); if (!video.ended) el.classList.add("paused"); });
  video.addEventListener("timeupdate",   () => {
    if (!video.duration) return;
    $(".bar b", el).style.width = (video.currentTime / video.duration * 100) + "%";
  });
  video.addEventListener("error", () => nextSource(card));

  /* --- הקשה: טאפ = השהיה, דאבל-טאפ = לייק --- */
  let tapTimer = null, lastTap = 0;
  el.addEventListener("click", ev => {
    if (ev.target.closest(".rail, .bar, .meta .caption")) return;
    const now = Date.now();
    if (now - lastTap < 280) {
      clearTimeout(tapTimer); lastTap = 0;
      setLike(card, true);
      spawnHeart(el, ev.clientX - el.getBoundingClientRect().left, ev.clientY - el.getBoundingClientRect().top);
      return;
    }
    lastTap = now;
    tapTimer = setTimeout(() => togglePlay(card), 280);
  });

  /* --- כפתורים --- */
  $(".like", el).addEventListener("click", () => setLike(card));
  $(".cmt",  el).addEventListener("click", () => openComments(card));
  $(".fav",  el).addEventListener("click", e => {
    const on = toggleFlag("fav", item.path);
    e.currentTarget.classList.toggle("on", on);
    $(".nFav", el).textContent = on ? "שמור ✓" : "שמור";
    toast(on ? "נשמר במועדפים" : "הוסר מהמועדפים");
  });
  $(".share", el).addEventListener("click", () => share(card));
  $(".caption", el).addEventListener("click", e => e.currentTarget.classList.toggle("open"));
  $(".avatar", el).addEventListener("click", () => {
    const c = clips[card.clip] || {};
    if (c.uid) openProfile(c.uid, c.name, c.photo);
    else toast("לסרטון הזה אין בעלים — הוא הועלה ישירות לגיטהאב");
  });
  $(".author", el).addEventListener("click", () => $(".avatar", el).click());

  /* --- גרירה על פס ההתקדמות --- */
  const bar = $(".bar", el);
  const seek = clientX => {
    const r = bar.getBoundingClientRect();
    const ratio = Math.min(1, Math.max(0, (clientX - r.left) / r.width));
    if (video.duration) video.currentTime = ratio * video.duration;
  };
  bar.addEventListener("pointerdown", e => {
    bar.classList.add("drag"); bar.setPointerCapture(e.pointerId); seek(e.clientX);
  });
  bar.addEventListener("pointermove", e => { if (bar.classList.contains("drag")) seek(e.clientX); });
  const endDrag = () => bar.classList.remove("drag");
  bar.addEventListener("pointerup", endDrag);
  bar.addEventListener("pointercancel", endDrag);

  /* --- מונים ומצב --- */
  card.key = vidKey(item.path);
  if (store.get("favs", {})[item.path]) {
    $(".fav", el).classList.add("on");
    $(".nFav", el).textContent = "שמור ✓";
  }
  paintCounts(card);

  feed.appendChild(el);
  return card;
}

function nextSource(card) {
  card.srcIdx++;
  if (card.srcIdx < card.srcs.length) {
    card.video.src = card.srcs[card.srcIdx];
    card.video.load();
    if (card.i === active) card.video.play().catch(() => {});
    return;
  }
  card.el.classList.remove("loading");
  if (!$(".vidErr", card.el)) {
    const d = document.createElement("div");
    d.className = "vidErr";
    d.innerHTML = "לא הצלחתי לנגן את הסרטון הזה.<br>בדוק שהקובץ קיים ברפו ושהוא MP4&nbsp;(H.264).";
    card.el.appendChild(d);
  }
}

function attach(card) {
  if (card.video.src) return;
  card.el.classList.add("loading");
  card.video.src = card.srcs[card.srcIdx];
  card.video.load();
}
function detach(card) {
  if (!card.video.src) return;
  card.video.pause();
  card.video.removeAttribute("src");
  card.video.load();
  card.srcIdx = 0;
  card.el.classList.remove("playing", "paused", "loading");
  $(".bar b", card.el).style.width = "0%";
}

/* ============================================================
   4. ניגון — רק הסרטון שעל המסך מתנגן
   ============================================================ */
function setActive(i) {
  if (i === active || !cards[i]) return;
  active = i;
  cards.forEach((c, j) => {
    const near = Math.abs(j - i) <= 1;
    if (near) attach(c); else detach(c);
    if (j !== i) { c.video.pause(); c.video.currentTime = 0; }
  });
  const c = cards[i];
  refreshLiked(c);
  c.video.muted = muted;
  c.video.play().catch(() => {
    // הדפדפן חסם ניגון עם קול — חוזרים להשתקה
    c.video.muted = true; muted = true; paintSound();
    c.video.play().catch(() => {});
  });
  history.replaceState(null, "", "#v" + (i + 1));
}

function togglePlay(card) {
  if (card.video.paused) card.video.play().catch(() => {});
  else card.video.pause();
}

function paintSound() {
  $("#sndWave").style.display = muted ? "none" : "";
  $("#sndMute").style.display = muted ? "" : "none";
  cards.forEach(c => { c.video.muted = muted; });
  store.set("muted", muted);
}

$("#btnSound").addEventListener("click", () => {
  muted = !muted; paintSound();
  toast(muted ? "הקול כבוי" : "הקול דולק");
  if (cards[active]) cards[active].video.play().catch(() => {});
});

/* מחווה ראשונה של המשתמש — מדליקים קול אוטומטית, כמו בטיקטוק */
function onFirstGesture() {
  if (firstGestureDone) return;
  firstGestureDone = true;
  if (!muted || store.get("everUnmuted", false)) return;   // המשתמש כבר בחר בעצמו
  muted = false; store.set("everUnmuted", true); paintSound();
  if (cards[active]) cards[active].video.play().catch(() => { muted = true; paintSound(); });
}
["pointerdown", "keydown"].forEach(ev =>
  window.addEventListener(ev, onFirstGesture, { once: true, passive: true }));

/* ============================================================
   5. לייקים / מועדפים / תגובות / שיתוף  (מקומי בדפדפן)
   ============================================================ */
function baseCount(key, min, max) {           // מספר יציב לכל סרטון, רק לאסתטיקה
  let h = 0;
  for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  return min + (h % (max - min));
}
function fmt(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M";
  if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K";
  return String(n);
}
function toggleFlag(bucket, key, force) {
  const m = store.get(bucket, {});
  const on = force === undefined ? !m[key] : force;
  if (on) m[key] = 1; else delete m[key];
  store.set(bucket, m);
  return on;
}
/** שם, תמונה וכיתוב של בעל הסרטון — מהענן אם מישהו העלה אותו דרך האתר */
function paintOwner(card) {
  const el = card.el, c = clips[card.clip] || {};
  const name = c.name || card.item.author || C.defaultAuthor;
  const cap  = c.caption || card.item.title || "";

  $(".author", el).textContent  = name.charAt(0) === "@" ? name : "@" + name;
  $(".caption", el).textContent = cap;

  const av = $(".avatar", el);
  if (c.photo) {
    av.innerHTML = '<img class="me-av" src="' + esc(c.photo) + '" alt="" referrerpolicy="no-referrer">';
  } else {
    av.textContent = name.replace(/^@/, "").charAt(0).toUpperCase() || "?";
  }
  card.ownerUid = c.uid || null;
}

/** בודק מול השרת אם המשתמש הנוכחי כבר עשה לייק לכרטיס הזה */
function refreshLiked(c) {
  if (!c || !CL.on || !CL.user || liked.has(c.key)) return;
  CL.hasLiked(c.key).then(v => { liked.set(c.key, v); paintCounts(c); });
}

/** מצייר את המונים של כרטיס — מהענן אם יש, אחרת מקומי */
function paintCounts(card) {
  const el = card.el, k = card.key, p = card.item.path;
  if (CL.on) {
    const s = stats[k] || {};
    $(".nLike", el).textContent = fmt(Math.max(0, s.likes || 0));
    $(".nCmt",  el).textContent = fmt(Math.max(0, s.comments || 0));
    $(".like",  el).classList.toggle("on", liked.get(k) === true);
  } else {
    const mine = !!store.get("likes", {})[p];
    $(".nLike", el).textContent = fmt(baseCount(p, 12, 900) + (mine ? 1 : 0));
    $(".nCmt",  el).textContent = fmt((store.get("cmts", {})[p] || []).length);
    $(".like",  el).classList.toggle("on", mine);
  }
}

function bumpHeart(card) {
  $(".like", card.el).animate(
    [{ transform: "scale(1)" }, { transform: "scale(1.3)" }, { transform: "scale(1)" }],
    { duration: 260 });
}

/* ---- התחברות עם Google ---- */
const G_SVG = '<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-3.1-.4-4.6H24v9.1h12.4c-.5 2.9-2.2 5.3-4.7 7l7.6 5.9c4.4-4.1 6.8-10.1 6.8-17.4z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.8-6.1C1 16.3 0 20 0 24s1 7.7 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.8 2.3-8.3 2.3-6.3 0-11.7-3.7-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';

function signedIn() { return !!(CL.on && CL.user); }

async function doSignIn(btn) {
  if (btn) { btn.disabled = true; btn.style.opacity = ".6"; }
  try {
    await CL.signIn();
    closeSheet();
    if (CL.user) toast("שלום " + CL.user.name);

/** מגירה שמסבירה למה צריך להתחבר */
function needLogin(what) {

    "<p>" + esc(what) + " אפשר רק עם חשבון Google.</p>" +

async function setLike(card, force) {
  if (CL.on && !CL.user) { needLogin("לעשות לייק"); return; }

  if (!CL.on) {                                   // מצב מקומי
    const on = toggleFlag("likes", card.item.path, force);
    paintCounts(card);
    if (on) bumpHeart(card);
    return;
  }

  const k = card.key;
  const cur = liked.get(k) === true;
  const on  = force === undefined ? !cur : force;
  if (on === cur) { if (on) bumpHeart(card); return; }   // דאבל-טאפ על לייק שכבר קיים

  // עדכון אופטימי — הממשק מגיב מיד, הענן משלים אחריו
  const s = (stats[k] = stats[k] || {});
  liked.set(k, on);
  s.likes = Math.max(0, (s.likes || 0) + (on ? 1 : -1));
  paintCounts(card);
  if (on) bumpHeart(card);

  try {
    await CL.setLike(k, on);
  } catch (e) {
    liked.set(k, cur);
    s.likes = Math.max(0, (s.likes || 0) + (on ? -1 : 1));
    paintCounts(card);
    toast("הלייק לא נשמר — " + cloudErr(e));
  }
}
function spawnHeart(el, x, y) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("fill", "currentColor");
  s.className = "heart";
  s.setAttribute("class", "heart");
  s.style.left = x + "px";
  s.style.top  = y + "px";
  s.innerHTML = '<path d="M12 20.7l-1.4-1.3C5.9 15.2 3 12.6 3 9.3 3 6.7 5 4.7 7.6 4.7c1.5 0 2.9.7 3.8 1.8l.6.8.6-.8c.9-1.1 2.3-1.8 3.8-1.8C19 4.7 21 6.7 21 9.3c0 3.3-2.9 5.9-7.6 10.1L12 20.7z"/>';
  el.appendChild(s);
  s.addEventListener("animationend", () => s.remove());
}

function share(card) {
  const url = location.origin + location.pathname + "#v" + (card.i + 1);
  const data = { title: C.appName || "סרטון", text: card.item.title || "", url };
  if (navigator.share) { navigator.share(data).catch(() => {}); return; }
  navigator.clipboard?.writeText(url).then(() => toast("הקישור הועתק")).catch(() => toast(url));
}

/* --- מגירת תגובות --- */
let openSheet = null, sheetCleanup = null;
function sheet(title, bodyHtml, footerHtml) {
  closeSheet();
  const back = document.createElement("div"); back.className = "backdrop";
  const s = document.createElement("div"); s.className = "sheet";
  s.innerHTML =
    '<h3><button class="x"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>' + title + "</h3>" +
    '<div class="body">' + bodyHtml + "</div>" + (footerHtml || "");
  document.body.append(back, s);
  back.addEventListener("click", closeSheet);
  $(".x", s).addEventListener("click", closeSheet);
  openSheet = [back, s];
  return s;
}
function closeSheet() {
  if (sheetCleanup) { try { sheetCleanup(); } catch {} sheetCleanup = null; }
  if (!openSheet) return;
  openSheet.forEach(n => n.remove());
  openSheet = null;
}

const COMMENT_FORM =
  '<form class="cmtForm"><input placeholder="הוסף תגובה…" maxlength="300" aria-label="תגובה">' +
  '<button type="submit" aria-label="שלח"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 20l18-8L3 4l4 8-4 8z"/></svg></button></form>';

function timeAgo(ts) {
  const ms = !ts ? 0 : (typeof ts === "number" ? ts : (ts.toMillis ? ts.toMillis() : 0));
  if (!ms) return "עכשיו";
  const d = Math.floor((Date.now() - ms) / 1000);
  if (d < 60) return "עכשיו";
  if (d < 3600) return Math.floor(d / 60) + " דק׳";
  if (d < 86400) return Math.floor(d / 3600) + " שע׳";
  if (d < 2592000) return Math.floor(d / 86400) + " ימים";
  return new Date(ms).toLocaleDateString("he-IL");
}

function commentRow(c, mine) {
  const av = c.photo
    ? '<img class="me-av" src="' + esc(c.photo) + '" alt="" referrerpolicy="no-referrer">'
    : esc((c.name || "?").charAt(0).toUpperCase());
  return '<div class="cmt">' +
    '<div class="av">' + av + "</div>" +
    '<div class="txt">' +
      '<div class="nm">' + esc(c.name || "אנונימי") + " · " + timeAgo(c.at) + "</div>" +
      '<div class="bd">' + esc(c.text) + "</div>" +
    "</div>" +
    (mine && c.id ? '<button class="del" data-del="' + esc(c.id) + '" aria-label="מחק">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></button>' : "") +
    "</div>";
}

/* ---- תגובות אמיתיות, משותפות, בזמן אמת ---- */
function cloudComments(card) {
  const k = card.key;
  const footer = signedIn()
    ? COMMENT_FORM
    : '<div class="signin-note"><span>כדי להגיב צריך חשבון Google</span>' +
      '<button id="gsi2">' + G_SVG + "התחבר</button></div>";

  const s = sheet("תגובות", '<div class="empty-note">טוען…</div>', footer);
  let list = [];

  const draw = () => {
    const who = signedIn()
      ? '<div class="who">מגיב בשם <b>' + esc(CL.user.name) + "</b></div>"
      : "";
    $(".body", s).innerHTML = who + (list.length
      ? list.map(c => commentRow(c, CL.user && c.uid === CL.user.uid)).join("")
      : '<div class="empty-note">אין עדיין תגובות.<br>תהיה הראשון לכתוב.</div>');

    $$("[data-del]", s).forEach(b => b.addEventListener("click", async () => {
      b.disabled = true;
      try { await CL.delComment(k, b.dataset.del); }
      catch (e) { b.disabled = false; toast("לא נמחק — " + cloudErr(e)); }
    }));
  };

  sheetCleanup = CL.watchComments(k, (docs, err) => {
    if (err) {
      $(".body", s).innerHTML = '<div class="empty-note">אין הרשאה לקרוא תגובות.<br>בדוק את חוקי האבטחה ב-Firestore.</div>';
      return;
    }
    list = docs;
    draw();
  });

  const gsi = $("#gsi2", s);
  if (gsi) { gsi.addEventListener("click", e => doSignIn(e.currentTarget)); return; }

  const input = $(".cmtForm input", s);
  $(".cmtForm", s).addEventListener("submit", async e => {
    e.preventDefault();
    const t = input.value.trim();
    if (!t) return;
    if (!signedIn()) { needLogin("להגיב"); return; }
    input.value = "";
    input.disabled = true;
    try { await CL.addComment(k, CL.user.name, t); }
    catch (err) { input.value = t; toast("התגובה לא נשלחה — " + cloudErr(err)); }
    input.disabled = false;
    input.focus();
  });

  setTimeout(() => input.focus(), 120);
}

/* ---- מצב מקומי (בלי Firebase) — נשמר רק במכשיר הזה ---- */
function localComments(card) {
  const key = card.item.path;
  const render = () => {
    const list = store.get("cmts", {})[key] || [];
    return '<div class="who">נשמר במכשיר הזה בלבד · <button id="rename">' + esc(myName()) + "</button></div>" +
      (list.length
        ? list.map(c => commentRow({ name: c.n, text: c.t, at: c.at }, false)).join("")
        : '<div class="empty-note">אין עדיין תגובות.<br>תהיה הראשון לכתוב.</div>');
  };
  const s = sheet("תגובות", render(), COMMENT_FORM);
  const redraw = () => {
    $(".body", s).innerHTML = render();
    const rn = $("#rename", s);
    if (rn) rn.addEventListener("click", () => { if (askName()) redraw(); });
  };
  redraw();

  const input = $(".cmtForm input", s);
  $(".cmtForm", s).addEventListener("submit", e => {
    e.preventDefault();
    const t = input.value.trim();
    if (!t) return;
    const all = store.get("cmts", {});
    (all[key] = all[key] || []).unshift({ n: myName(), t, at: Date.now() });
    store.set("cmts", all);
    input.value = "";
    redraw();
    paintCounts(card);
  });
  setTimeout(() => input.focus(), 120);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
}

/* --- טוסט --- */
let toastTimer;
function toast(msg) {
  $$(".pill").forEach(p => p.remove());
  const p = document.createElement("div");
  p.className = "pill";
  p.textContent = msg;
  document.body.appendChild(p);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => p.remove(), 1900);
}

/* ============================================================
   העלאת סרטון מהאתר ישירות לרפו בגיטהאב
   ============================================================ */
const GH_API = "https://api.github.com";

function ghHeaders() {
  return {
    Authorization: "Bearer " + CL.ghToken,
    Accept: "application/vnd.github+json",
    "Content-Type": "application/json"
  };
}

async function ghFetch(path, opts) {
  const r = await fetch(GH_API + path, Object.assign({ headers: ghHeaders() }, opts || {}));
  const txt = await r.text();
  let body = null;
  try { body = txt ? JSON.parse(txt) : null; } catch {}
  if (!r.ok) {
    const msg = (body && body.message) || ("HTTP " + r.status);
    const e = new Error(msg);
    e.status = r.status;
    throw e;
  }
  return body;
}

/** קובץ → base64 נקי (בלי הקידומת data:) */
function toBase64(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("לא הצלחתי לקרוא את הקובץ"));
    fr.onload  = () => res(String(fr.result).split(",")[1] || "");
    fr.readAsDataURL(file);
  });
}

/* ---- בדיקת קובץ לפני העלאה ----
   סיומת + סוג MIME + חתימת הבייטים בפועל. השלישית היא החשובה:
   בלעדיה אפשר לשנות שם של כל קובץ ל-.mp4 ולדחוף אותו לרפו. */
const ALLOWED_EXT  = /\.(mp4|m4v|mov|webm|ogv)$/i;
const MAX_BYTES    = 100 * 1024 * 1024;
const MP4_BOXES    = ["ftyp", "moov", "mdat", "free", "wide", "skip", "pnot"];

function readHead(file, n) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("לא הצלחתי לקרוא את הקובץ"));
    fr.onload  = () => res(new Uint8Array(fr.result));
    fr.readAsArrayBuffer(file.slice(0, n));
  });
}

/** מחזיר null אם הקובץ תקין, אחרת מחרוזת הסבר למה הוא נדחה */
async function rejectReason(file) {
  if (!file || !file.size) return "הקובץ ריק.";
  if (file.size > MAX_BYTES) return "הקובץ " + (file.size / 1048576).toFixed(1) + "MB — המקסימום בגיטהאב הוא 100MB.";
  if (!ALLOWED_EXT.test(file.name)) return "מותר רק MP4, MOV, WEBM או OGV. זה " + (file.name.split(".").pop() || "ללא סיומת") + ".";
  if (file.type && !/^video\//i.test(file.type)) return "הדפדפן מזהה את הקובץ כ-" + file.type + ", לא כווידאו.";

  let head;
  try { head = await readHead(file, 16); }
  catch { return "לא הצלחתי לקרוא את תחילת הקובץ."; }
  if (head.length < 12) return "הקובץ קצר מדי מכדי להיות וידאו.";

  const ascii = (from, len) => String.fromCharCode.apply(null, head.subarray(from, from + len));

  const isMp4  = MP4_BOXES.indexOf(ascii(4, 4)) > -1;                 // MP4 / MOV
  const isWebm = head[0] === 0x1A && head[1] === 0x45 &&
                 head[2] === 0xDF && head[3] === 0xA3;                // WebM / MKV
  const isOgg  = ascii(0, 4) === "OggS";                              // Ogg

  if (!isMp4 && !isWebm && !isOgg) {
    return "זה לא קובץ וידאו. שינוי הסיומת ל-mp4 לא הופך קובץ לסרטון.";
  }
  return null;
}

function slugify(s) {
  return (s || "").trim().toLowerCase()
    .replace(/['"]/g, "")
    .replace(/[^\p{L}\p{N}]+/gu, "-")
    .replace(/^-+|-+$/g, "")
    .slice(0, 60);
}

/** מעלה קובץ אחד כקומיט. המנהל מפרסם ישר לפיד, כל השאר נכנסים לתור. */
async function ghCommitFile(file, caption, onStep) {
  const o = CONFIG.owner, r = CONFIG.repo, br = CONFIG.branch;
  const target = isAdmin() ? CONFIG.videosDir : (CONFIG.pendingDir || CONFIG.videosDir);
  const dir = (target || "").replace(/^\/+|\/+$/g, "");
  const ext = (file.name.match(/\.[a-z0-9]+$/i) || [".mp4"])[0].toLowerCase();
  const base = slugify(caption) || slugify(file.name.replace(/\.[^.]+$/, "")) || "clip";
  const stamp = new Date().toISOString().slice(0, 10).replace(/-/g, "");
  const path = (dir ? dir + "/" : "") + stamp + "-" + base + "-" + Math.random().toString(36).slice(2, 6) + ext;

  onStep("קורא את הקובץ…");
  const content = await toBase64(file);

  onStep("מאתר את הענף…");
  const ref = await ghFetch(`/repos/${o}/${r}/git/ref/heads/${br}`);
  const headSha = ref.object.sha;

  onStep("מעלה את הווידאו…");
  const blob = await ghFetch(`/repos/${o}/${r}/git/blobs`, {
    method: "POST",
    body: JSON.stringify({ content, encoding: "base64" })
  });

  onStep("בונה את הקומיט…");
  const headCommit = await ghFetch(`/repos/${o}/${r}/git/commits/${headSha}`);
  const tree = await ghFetch(`/repos/${o}/${r}/git/trees`, {
    method: "POST",
    body: JSON.stringify({
      base_tree: headCommit.tree.sha,
      tree: [{ path, mode: "100644", type: "blob", sha: blob.sha }]
    })
  });
  const commit = await ghFetch(`/repos/${o}/${r}/git/commits`, {
    method: "POST",
    body: JSON.stringify({
      message: "הוספת סרטון: " + (caption || path),
      tree: tree.sha,
      parents: [headSha]
    })
  });

  onStep("מפרסם…");
  await ghFetch(`/repos/${o}/${r}/git/refs/heads/${br}`, {
    method: "PATCH",
    body: JSON.stringify({ sha: commit.sha })
  });

  return path;
}

/* ============================================================
   העלאה ישירה ל-Cloudinary — בלי GitHub, בלי התחברות נוספת
   ============================================================ */
function cloudinaryOn() {
  const c = C.cloudinary || {};
  return !!(c.cloudName && c.uploadPreset);
}

/** מעלה קובץ ישירות ל-Cloudinary. onProgress מקבל אחוזים. */
function cloudinaryUpload(file, caption, onProgress) {
  return new Promise((res, rej) => {
    const c = C.cloudinary;
    const fd = new FormData();
    fd.append("file", file);
    fd.append("upload_preset", c.uploadPreset);
    if (caption) fd.append("context", "caption=" + caption.replace(/[|=]/g, " "));

    const xhr = new XMLHttpRequest();
    xhr.open("POST", "https://api.cloudinary.com/v1_1/" + c.cloudName + "/video/upload");
    xhr.upload.onprogress = e => {
      if (e.lengthComputable && onProgress) onProgress(Math.round(e.loaded / e.total * 100));
    };
    xhr.onload = () => {
      let body = null;
      try { body = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status >= 200 && xhr.status < 300 && body && body.secure_url) res(body);
      else {
        const msg = (body && body.error && body.error.message) || ("HTTP " + xhr.status);
        rej(new Error(msg));
      }
    };
    xhr.onerror = () => rej(new Error("אין חיבור לרשת"));
    xhr.send(fd);
  });
}

function cloudinaryError(e) {
  const m = (e && e.message) || "";
  if (/preset not found|Upload preset/i.test(m)) return "שם ה-preset שגוי, או שהוא לא מוגדר כ-Unsigned.";
  if (/File size too large|too large/i.test(m)) return "הקובץ גדול מדי למכסה החינמית.";
  if (/Invalid cloud_name|cloud_name/i.test(m)) return "שם הענן (cloud name) שגוי.";
  return m || "שגיאה לא ידועה";
}

/* ---- תור האישורים של המנהל ---- */
function isAdmin() {
  return !!(CL.user && C.adminEmail &&
            CL.user.email.toLowerCase() === C.adminEmail.toLowerCase());
}

/** כל הסרטונים שממתינים לאישור, מהרפו הציבורי (בלי צורך בטוקן) */
async function listPending() {
  const pend = (C.pendingDir || "").replace(/^\/+|\/+$/g, "").toLowerCase();
  if (!pend) return [];
  const api = `https://api.github.com/repos/${C.owner}/${C.repo}/git/trees/${C.branch}?recursive=1&t=${Date.now()}`;
  const r = await fetch(api, { headers: { Accept: "application/vnd.github+json" }, cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const data = await r.json();
  return (data.tree || [])
    .filter(n => n.type === "blob" && VIDEO_EXT.test(n.path) &&
                 n.path.toLowerCase().startsWith(pend + "/"))
    .map(n => ({ path: n.path, sha: n.sha, size: n.size || 0 }))
    .sort((a, b) => a.path.localeCompare(b.path));
}

/** מעביר קובץ מההמתנה לפיד, או מוחק אותו — הכל בקומיט אחד */
async function ghMoveOrDelete(fromPath, toPath, blobSha, message) {
  const o = C.owner, r = C.repo, br = C.branch;
  const ref = await ghFetch(`/repos/${o}/${r}/git/ref/heads/${br}`);
  const headSha = ref.object.sha;
  const headCommit = await ghFetch(`/repos/${o}/${r}/git/commits/${headSha}`);

  const entries = [{ path: fromPath, mode: "100644", type: "blob", sha: null }]; // null = מחיקה
  if (toPath) entries.push({ path: toPath, mode: "100644", type: "blob", sha: blobSha });

  const tree = await ghFetch(`/repos/${o}/${r}/git/trees`, {
    method: "POST",
    body: JSON.stringify({ base_tree: headCommit.tree.sha, tree: entries })
  });
  const commit = await ghFetch(`/repos/${o}/${r}/git/commits`, {
    method: "POST",
    body: JSON.stringify({ message, tree: tree.sha, parents: [headSha] })
  });
  await ghFetch(`/repos/${o}/${r}/git/refs/heads/${br}`, {
    method: "PATCH",
    body: JSON.stringify({ sha: commit.sha })
  });
}

function approvedPathFor(pendingPath) {
  const dir = (C.videosDir || "").replace(/^\/+|\/+$/g, "");
  const name = pendingPath.split("/").pop();
  return (dir ? dir + "/" : "") + name;
}

function uploadError(e) {
  const m = (e && e.message) || "";
  if (e && e.status === 404) return "אין לך הרשאת כתיבה לרפו הזה.";
  if (e && e.status === 403) return "GitHub חסם את הבקשה (הרשאות או מגבלת קצב).";
  if (e && e.status === 409) return "מישהו דחף שינוי באותו רגע. נסה שוב.";
  if (e && e.status === 422) return "הקובץ נדחה — אולי הוא גדול מדי (מעל 100MB).";
  return m || "שגיאה לא ידועה";
}

function clipsOf(uid) {

function openProfile(uid, fallbackName, fallbackPhoto) {
  const me   = CL.user && CL.user.uid === uid;
  const mine = uid ? clipsOf(uid) : [];
  const any  = mine.length ? (clips[mine[0].clip] || {}) : {};
  const name  = any.name  || fallbackName  || (me && CL.user.name)  || "משתמש";
  const photo = any.photo || fallbackPhoto || (me && CL.user.photo) || "";

  let likes = 0;
  mine.forEach(c => { likes += Math.max(0, (stats[c.key] || {}).likes || 0); });

  const grid = mine.length
    ? '<div class="pgrid">' + mine.map(c =>
        '<button class="pcell" data-go="' + c.i + '">' +
          '<video src="' + esc(c.srcs[0]) + '" muted playsinline preload="metadata"></video>' +
          '<span class="plikes">♥ ' + fmt(Math.max(0, (stats[c.key] || {}).likes || 0)) + "</span>" +
        "</button>").join("") + "</div>"
    : '<div class="empty-note">' + (me
        ? "עוד לא העלית סרטונים.<br>לחץ על + כדי להעלות את הראשון."
        : "אין עדיין סרטונים מהמשתמש הזה.") + "</div>";

  const following = iFollow.has(uid);
  const canFollow = CL.on && !me && uid;

  const s = sheet("פרופיל",
    '<div class="prof">' +
      '<div class="ppic">' + (photo
        ? '<img class="me-av" src="' + esc(photo) + '" alt="" referrerpolicy="no-referrer">'
        : esc(name.charAt(0).toUpperCase())) + "</div>" +
      '<div class="pname2">@' + esc(name.replace(/^@/, "")) + "</div>" +
      '<div class="pstats">' +
        "<div><b>" + fmt(followers[uid] || 0) + "</b><span>עוקבים</span></div>" +
        "<div><b>" + mine.length + "</b><span>סרטונים</span></div>" +
        "<div><b>" + fmt(likes) + "</b><span>לייקים</span></div>" +
      "</div>" +
      (canFollow
        ? '<button class="btn follow' + (following ? " on" : "") + '" id="fbtn">' +
          (following ? "עוקב ✓" : "עקוב") + "</button>"
        : "") +
    "</div>" + grid);

  const fb = $("#fbtn", s);
  if (fb) fb.addEventListener("click", async () => {

    const on = !iFollow.has(uid);
    fb.disabled = true;
    // עדכון מיידי, הענן משלים אחריו
    if (on) iFollow.add(uid); else iFollow.delete(uid);
    followers[uid] = Math.max(0, (followers[uid] || 0) + (on ? 1 : -1));
    fb.textContent = on ? "עוקב ✓" : "עקוב";
    fb.classList.toggle("on", on);
    $(".pstats b", s).textContent = fmt(followers[uid] || 0);
    try { await CL.setFollow(uid, on); }
    catch (e) {
      if (on) iFollow.delete(uid); else iFollow.add(uid);
      followers[uid] = Math.max(0, (followers[uid] || 0) + (on ? -1 : 1));
      fb.textContent = iFollow.has(uid) ? "עוקב ✓" : "עקוב";
      fb.classList.toggle("on", iFollow.has(uid));
      toast("לא נשמר — " + cloudErr(e));
    }
    fb.disabled = false;
  });

  $$("[data-go]", s).forEach(b => b.addEventListener("click", () => {
    closeSheet();
    feed.scrollTo({ top: +b.dataset.go * feed.clientHeight, behavior: "smooth" });
  }));
}

/* ============================================================
   מסך המנהל — אישור או דחייה של סרטונים שהועלו
   ============================================================ */
async function openReview() {
  const s = sheet("ממתינים לאישור", '<div class="empty-note">טוען…</div>', "");
  const body = () => $(".body", s);

  const render = async () => {
    let list = [], cloudList = [];

    // סרטונים שממתינים ב-Cloudinary — אישור כאן הוא עדכון שדה אחד, בלי גיטהאב
    if (CL.on && CL.listClips) {
      try {
        cloudList = (await CL.listClips())
          .filter(d => d.src && d.approved === false)
          .sort((a, b) => (b.atMs || 0) - (a.atMs || 0));
      } catch {}
    }

    try { list = await listPending(); }
    catch (e) { if (!cloudList.length) { body().innerHTML = '<div class="empty-note">לא הצלחתי לקרוא את התור — ' + esc(e.message) + "</div>"; return; } }

    if (cloudList.length) {
      body().innerHTML = cloudList.map((p, i) =>
        '<div class="pend" data-ci="' + i + '">' +
          '<video class="pvid" src="' + esc(p.src) + '" controls playsinline preload="metadata"></video>' +
          '<div class="pname">' + esc(p.caption || "ללא כיתוב") + " · מאת " + esc(p.name || "אנונימי") + "</div>" +
          '<div class="pacts">' +
            '<button class="ok" data-cok="' + i + '">אשר לפיד</button>' +
            '<button class="no" data-cno="' + i + '">דחה ומחק</button>' +
          "</div><div class=\"pstat\"></div>" +
        "</div>").join("") +
        (list.length ? '<div class="who">ועוד ' + list.length + " בתיקיית pending בגיטהאב</div>" : "");

      $$("[data-cok]", s).forEach(b => b.addEventListener("click", async () => {
        const p = cloudList[+b.dataset.cok], row = b.closest(".pend");
        $$("button", row).forEach(x => (x.disabled = true));
        $(".pstat", row).textContent = "מאשר…";
        try { await CL.approveClip(p.id); toast("אושר — יופיע בפיד"); await render(); }
        catch (e) { $$("button", row).forEach(x => (x.disabled = false)); $(".pstat", row).textContent = ""; toast("לא אושר — " + cloudErr(e)); }
      }));

      $$("[data-cno]", s).forEach(b => b.addEventListener("click", async () => {
        const p = cloudList[+b.dataset.cno], row = b.closest(".pend");
        if (!confirm("למחוק את \"" + (p.caption || "הסרטון") + "\"?")) return;
        $$("button", row).forEach(x => (x.disabled = true));
        $(".pstat", row).textContent = "מוחק…";
        try { await CL.deleteClip(p.id); toast("נדחה"); await render(); }
        catch (e) { $$("button", row).forEach(x => (x.disabled = false)); $(".pstat", row).textContent = ""; toast("לא נמחק — " + cloudErr(e)); }
      }));
      return;
    }

    if (!list.length) {
      body().innerHTML = '<div class="empty-note">אין סרטונים שממתינים.<br>כל מה שהועלה כבר טופל.</div>';
      return;
    }

    if (!CL.ghToken) {
      body().innerHTML =
        "<p><b>" + list.length + "</b> סרטונים ממתינים. כדי לאשר או לדחות צריך להתחבר ל-GitHub.</p>" +
        '<button class="btn" id="ghrev">' + GH_SVG + "להתחבר עם GitHub</button>" +
        list.map(p => '<div class="pend"><div class="pname">' + esc(prettify(p.path)) +
          " · " + (p.size / 1048576).toFixed(1) + "MB</div></div>").join("");
      $("#ghrev", s).addEventListener("click", async e => {
        const b = e.currentTarget; b.disabled = true; b.style.opacity = ".6";
        try { await CL.ghSignIn(); await render(); }
        catch (err) {
          const c = (err && err.code) || "";
          if (/popup-blocked/.test(c)) toast("הדפדפן חסם את חלון ההתחברות — אשר חלונות קופצים");
          else if (!/popup-closed-by-user|cancelled-popup-request/.test(c)) toast("ההתחברות נכשלה");
          b.disabled = false; b.style.opacity = "";
        }
      });
      return;
    }

    body().innerHTML = list.map((p, i) =>
      '<div class="pend" data-i="' + i + '">' +
        '<video class="pvid" src="' + esc(srcsFor(p.path)[0]) + '" controls playsinline preload="metadata"></video>' +
        '<div class="pname">' + esc(prettify(p.path)) + " · " + (p.size / 1048576).toFixed(1) + "MB</div>" +
        '<div class="pacts">' +
          '<button class="ok"  data-ok="'  + i + '">אשר לפיד</button>' +
          '<button class="no"  data-no="'  + i + '">דחה ומחק</button>' +
        "</div>" +
        '<div class="pstat"></div>' +
      "</div>").join("");

    const busy = (row, msg) => {
      $$("button", row).forEach(b => (b.disabled = true));
      $(".pstat", row).textContent = msg;
    };
    const free = row => {
      $$("button", row).forEach(b => (b.disabled = false));
      $(".pstat", row).textContent = "";
    };

    $$("[data-ok]", s).forEach(b => b.addEventListener("click", async () => {
      const p = list[+b.dataset.ok], row = b.closest(".pend");
      busy(row, "מאשר…");
      try {
        await ghMoveOrDelete(p.path, approvedPathFor(p.path), p.sha, "אישור סרטון: " + p.path.split("/").pop());
        toast("אושר — יופיע בפיד");
        await render();
      } catch (e) { free(row); toast("לא אושר — " + uploadError(e)); }
    }));

    $$("[data-no]", s).forEach(b => b.addEventListener("click", async () => {
      const p = list[+b.dataset.no], row = b.closest(".pend");
      if (!confirm("למחוק לצמיתות את \"" + prettify(p.path) + "\"?")) return;
      busy(row, "מוחק…");
      try {
        await ghMoveOrDelete(p.path, null, null, "דחיית סרטון: " + p.path.split("/").pop());
        toast("נדחה ונמחק");
        await render();
      } catch (e) { free(row); toast("לא נמחק — " + uploadError(e)); }
    }));
  };

  await render();
}

async function openUpload() {
  // הענן אולי עדיין נטען — מחכים לו לפני שמחליטים מה להציג
  if (!CL.on && !CL.error) {
    sheet("להוסיף סרטון", '<div class="empty-note">מתחבר…</div>', "");
    await window.cloudReady;
    if (!openSheet) return;        // המשתמש סגר בינתיים
  }

  if (!CL.on) {
    sheet("להוסיף סרטון",
      "<p>העלאה מהאתר דורשת חיבור ל-Firebase (הוא מטפל בהתחברות ל-GitHub). כרגע האפליקציה במצב מקומי.</p>" +
      '<a class="btn ghost" href="' + uploadUrl + '" target="_blank" rel="noopener">להעלות דרך גיטהאב</a>');
    return;
  }

  const s = sheet("להוסיף סרטון",
    '<div id="upBody"></div>',
    "");

  const draw = () => {
    const body = $("#upBody", s);
    const direct = isAdmin();     // המנהל מפרסם ישר, בלי תור

    body.innerHTML =
      '<input type="file" id="vfile" accept="video/*" style="display:none">' +
      '<button class="btn ghost" id="pick">בחר סרטון מהמכשיר</button>' +
      '<div id="picked" class="upinfo"></div>' +
      '<input id="vcap" class="upcap" maxlength="80" placeholder="כיתוב (אופציונלי)">' +
      '<button class="btn" id="go" disabled>' + (direct ? "פרסם" : "שלח לאישור") + "</button>" +
      '<div id="ups" class="upstat"></div>' +
      '<p style="margin-top:12px">' +
      (direct ? "הסרטון יעלה ישר לפיד." : "הסרטון נשלח לבדיקת המנהל ומופיע רק אחרי שאושר.") +
      " עד 100MB, מומלץ MP4 אנכי עד ~30 שניות." +
      (CL.ghToken ? "" : "<br>בלחיצה תתבקש פעם אחת לאשר גישה ל-GitHub — שם הסרטונים נשמרים.") +
      "</p>";

    const fileInput = $("#vfile", s), go = $("#go", s), info = $("#picked", s), st = $("#ups", s);
    $("#pick", s).addEventListener("click", () => fileInput.click());

    fileInput.addEventListener("change", async () => {
      const f = fileInput.files && fileInput.files[0];
      info.classList.remove("bad");
      if (!f) { info.textContent = ""; go.disabled = true; return; }

      info.textContent = "בודק את הקובץ…";
      go.disabled = true;
      const bad = await rejectReason(f);
      if (bad) {
        info.classList.add("bad");
        info.textContent = "✕ " + bad;
        fileInput.value = "";          // לא משאירים קובץ פסול תקוע בטופס
        return;
      }
      info.textContent = "✓ " + f.name + " · " + (f.size / 1048576).toFixed(1) + "MB";
      go.disabled = false;
    });

    go.addEventListener("click", async () => {
      const f = fileInput.files && fileInput.files[0];
      if (!f) return;

      const bad = await rejectReason(f);      // בדיקה שנייה, ממש לפני הכתיבה לרפו
      if (bad) { toast("נחסם — " + bad); fileInput.value = ""; info.textContent = ""; go.disabled = true; return; }

      go.disabled = true; go.style.opacity = ".6";
      $("#pick", s).disabled = true;

      const fail = msg => {
        st.textContent = "";
        if (msg) toast(msg);
        go.disabled = false; go.style.opacity = "";
        $("#pick", s).disabled = false;
      };

      const cap = $("#vcap", s).value;

      /* --- המסלול המהיר: העלאה ישירה ל-Cloudinary, בלי GitHub --- */
      if (cloudinaryOn()) {
        try {
          st.textContent = "מעלה… 0%";
          const up = await cloudinaryUpload(f, cap, p => { st.textContent = "מעלה… " + p + "%"; });
          st.textContent = "שומר…";
          await CL.setClip("cl-" + up.public_id.replace(/[^a-zA-Z0-9_-]/g, "-"), {
            caption: cap, src: up.secure_url, approved: direct
          });
          if (direct) {
            st.textContent = "פורסם ✓";
            toast("הסרטון פורסם");
            setTimeout(() => location.reload(), 1800);
          } else {
            st.textContent = "נשלח ✓ ממתין לאישור המנהל";
            toast("הסרטון נשלח לאישור");
            fileInput.value = ""; info.textContent = "";
            $("#pick", s).disabled = false;
          }
        } catch (e) {
          fail("ההעלאה נכשלה — " + cloudinaryError(e));
        }
        return;
      }

      /* --- המסלול הישן: קומיט לגיטהאב --- */
      // ההתחברות ל-GitHub קורית כאן, כחלק מהפרסום — לא כמסך נפרד לפניו
      if (!CL.ghToken) {
        st.textContent = "מתחבר ל-GitHub…";
        try { await CL.ghSignIn(); }
        catch (err) {
          const c = (err && err.code) || "";
          if (/popup-blocked/.test(c)) return fail("הדפדפן חסם את חלון ההתחברות — אשר חלונות קופצים ונסה שוב");
          if (/popup-closed-by-user|cancelled-popup-request/.test(c)) return fail(null);
          return fail("ההתחברות נכשלה — " + ((err && err.message) || c));
        }
      }

      try {
        const path = await ghCommitFile(f, cap, m => { st.textContent = m; });
        // רושמים מי העלה — כך לסרטון יש בעלים, תמונה וכיתוב בפיד
        try { await CL.setClip(clipKey(path), { caption: cap }); }
        catch (err) { console.warn("[cloud] clip meta:", err && err.code); }

        if (direct) {
          st.textContent = "פורסם ✓ טוען את הפיד…";
          toast("הסרטון פורסם");
          setTimeout(() => location.reload(), 2500);
        } else {
          st.textContent = "נשלח ✓ ממתין לאישור המנהל";
          toast("הסרטון נשלח לאישור");
          $("#pick", s).disabled = false;
          fileInput.value = "";
          info.textContent = "";
        }
      } catch (e) {
        fail("ההעלאה נכשלה — " + uploadError(e));
      }
    });
  };

  draw();
}

/** מסנן את הפיד לפי הלשונית הנבחרת */
function applyTab() {
  if (!cards.length) return;
  let shown = 0;

  cards.forEach(c => {
    const uid = (clips[c.clip] || {}).uid;
    const ok = tab !== "following" || (uid && iFollow.has(uid));
    c.el.style.display = ok ? "" : "none";
    if (ok) shown++;
  });

  let note = $("#tabNote");
  if (tab === "following" && !shown) {
    if (!note) {
      note = document.createElement("div");
      note.id = "tabNote";
      note.className = "full";
      note.style.zIndex = "8";
      document.body.appendChild(note);
    }
    note.innerHTML =
      '<div class="logo"><svg viewBox="0 0 24 24" fill="#fff"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20c.9-3.6 3.8-5.4 7.2-5.4s6.3 1.8 7.2 5.4" fill="none" stroke="#fff" stroke-width="2"/></svg></div>' +
      "<h1>עוד לא עוקב אחרי אף אחד</h1>" +
      "<h2>" + (signedIn()
        ? "לחץ על התמונה של מישהו בפיד ואז על ״עקוב״"
        : "התחבר עם Google כדי לעקוב אחרי אנשים") + "</h2>" +
      '<div class="acts"><button class="btn" id="backForYou">חזרה ל״בשבילך״</button></div>';
    $("#backForYou", note).addEventListener("click", () => {
      $$(".tabs button").forEach(x => x.classList.toggle("on", x.dataset.tab === "foryou"));
      tab = "foryou";
      applyTab();
    });
    note.classList.remove("hidden");
  } else if (note) {
    note.remove();
  }

  // אחרי סינון הכרטיסים הגלילה מתאפסת, אז מנגנים את הראשון שנשאר
  const first = cards.find(c => c.el.style.display !== "none");
  if (first) { feed.scrollTop = 0; active = -1; setActive(first.i); }
}

window.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeSheet(); return; }   // גם כשהפוקוס בשדה טקסט
  if (e.target.matches("input, textarea")) return;
  const h = feed.clientHeight;
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === "j") {
    e.preventDefault(); feed.scrollBy({ top: h, behavior: "smooth" });
  } else if (e.key === "ArrowUp" || e.key === "PageUp" || e.key === "k") {
    e.preventDefault(); feed.scrollBy({ top: -h, behavior: "smooth" });
  } else if (e.key === " ") {
    e.preventDefault(); if (cards[active]) togglePlay(cards[active]);
  } else if (e.key.toLowerCase() === "m") {
    $("#btnSound").click();
  } else if (e.key.toLowerCase() === "l") {
    if (cards[active]) setLike(cards[active]);
  } else if (e.key === "Escape") {
    closeSheet();
  }
});

document.addEventListener("visibilitychange", () => {
  if (!cards[active]) return;
  if (document.hidden) cards[active].video.pause();
  else cards[active].video.play().catch(() => {});
});

    '<div class="box"><ol>' +
    "<li>בגיטהאב: <b>Add file ▸ Create new file</b>, קוראים לקובץ <code>" + esc((C.videosDir || "videos")) + "/.gitkeep</code> ושומרים — ככה נוצרת התיקייה</li>" +
    "<li>נכנסים לתיקייה ולוחצים <b>Add file ▸ Upload files</b></li>" +
    "<li>גוררים סרטוני <code>.mp4</code> ולוחצים <b>Commit changes</b></li>" +
    "<li>חוזרים לכאן ומרעננים</li>" +
    "</ol></div>" +
    '<div class="acts">' +
    '<a class="btn" href="' + uploadUrl + '" target="_blank" rel="noopener">פתח את עמוד ההעלאה</a>' +
    '<button class="btn ghost" onclick="location.reload()">כבר העליתי — רענן</button>' +
    "</div>" +
    '<p class="tiny">עד 100MB לקובץ. אפשר גם לשלוט בסדר ובכותרות דרך קובץ <code>videos.json</code> בשורש הרפו.</p>';
  boot.classList.remove("hidden");
}

async function start() {
  // הענן נטען ראשון — הפיד מורכב גם מסרטונים שנרשמו בו
  CL = await Promise.race([
    window.cloudReady,
    new Promise(r => setTimeout(() => r(window.CLOUD), 6000))
  ]);

  try {
    items = await discover();
  } catch (e) {
    showEmpty(String(e.message) === "rate"
      ? "גיטהאב חוסם זמנית (מגבלת 60 בקשות לשעה). נסה שוב בעוד כמה דקות."
      : "לא הצלחתי להתחבר לענן. בדוק חיבור אינטרנט.");
    return;
  }

  if (!items.length) { showEmpty(); return; }

  cards = items.map(buildCard);

  const wireCloud = () => {
    if (!CL.on) {
      if (CL.error) setTimeout(() => toast("הענן לא זמין — " + cloudErr({ code: CL.error })), 1400);
      return;
    }
    CL.watchStats(m => { Object.assign(stats, m); cards.forEach(paintCounts); });
    CL.watchClips(m => { Object.assign(clips, m); cards.forEach(paintOwner); applyTab(); });
    CL.watchFollows(list => {
      followers = {};
      const mineSet = new Set();
      const myUid = CL.user && CL.user.uid;
      list.forEach(f => {
        followers[f.following] = (followers[f.following] || 0) + 1;
        if (myUid && f.follower === myUid) mineSet.add(f.following);
      });
      iFollow = mineSet;
      applyTab();
    });
    // התחברות או התנתקות — הלייקים האישיים שייכים למשתמש, אז מאפסים ובודקים מחדש
    CL.onUser(u => {
      liked.clear();
      if (!u) iFollow = new Set();
      cards.forEach(paintCounts);
      refreshLiked(cards[active]);
      applyTab();
    });
  };

  // אם הענן איחר לענות, מחברים אותו כשהוא מגיע במקום לוותר עליו
  if (CL.on || CL.error) wireCloud();
  else window.cloudReady.then(() => { cards.forEach(paintCounts); wireCloud(); });

  // מעקב אחרי הסרטון שבמסך
  const io = new IntersectionObserver(entries => {
    for (const en of entries) {
      if (en.isIntersecting && en.intersectionRatio >= 0.6) {
        setActive(cards.findIndex(c => c.el === en.target));
      }
    }
  }, { root: feed, threshold: [0, .6, 1] });
  cards.forEach(c => io.observe(c.el));

  paintSound();
  boot.classList.add("hidden");

  // קישור ישיר לסרטון מסוים (#v3)
  const m = location.hash.match(/^#v(\d+)$/);
  const startAt = m ? Math.min(items.length, Math.max(1, +m[1])) - 1 : 0;
  if (startAt > 0) feed.scrollTop = startAt * feed.clientHeight;
  setActive(startAt);

  // שמירה על המקום כשמסתובב המסך / משתנה הגובה
  let rt;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    const i = active;
    rt = setTimeout(() => { if (i >= 0) feed.scrollTop = i * feed.clientHeight; }, 180);
  });
}

start();
})();
</script>
